<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos | Vihaan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #11141b;
        --ink: #f3f5f9;
        --dark: #11141b;
        --muted: #a5afc4;
        --orange: #ff6a1a;
        --steel: #3d8bff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        margin: 0;
        padding: 40px 16px 80px;
        font-family: "Barlow", "Segoe UI", Arial, sans-serif;
        font-size: 1.05rem;
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          repeating-linear-gradient(135deg, transparent 0 22px, rgba(255, 106, 26, 0.05) 22px 44px);
        background-size: 40px 40px, 40px 40px, auto;
      }

      h1, .back {
        font-family: "Oswald", "Impact", "Arial Narrow", sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .page {
        max-width: 900px;
        margin: 0 auto;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 32px;
        padding: 20px 26px;
        color: var(--dark);
        background: var(--orange);
        border: 5px solid #fff;
        border-radius: 12px;
        box-shadow: 7px 7px 0 #000;
      }

      h1 {
        margin: 0;
        font-size: 2.2rem;
        line-height: 1;
      }

      .back {
        padding: 9px 18px;
        font-size: 0.95rem;
        color: #fff;
        text-decoration: none;
        background: var(--dark);
        border: 3px solid #fff;
        border-radius: 8px;
        box-shadow: 3px 3px 0 #000;
      }

      .back:hover,
      .back:focus-visible {
        background: #000;
      }

      .intro {
        margin: 0 0 28px;
        color: var(--muted);
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 24px;
      }

      /* Each photo is a framed sticker. Replace a placeholder with a real photo
         by swapping the .slot div for: <img src="photos/your-photo.jpg" alt="..."> */
      .frame {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #fff;
        border: 5px solid #fff;
        border-radius: 12px;
        box-shadow: 6px 6px 0 #000;
      }

      .frame:nth-child(odd) {
        transform: rotate(-1deg);
      }

      .frame:nth-child(even) {
        transform: rotate(1deg);
      }

      .frame img,
      .slot {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
      }

      .slot {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-weight: 600;
        background: #1c212c;
      }

      figcaption {
        padding: 10px 6px 6px;
        color: var(--dark);
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <h1>📷 My Life in Photos</h1>
        <a class="back" href="index.html">← Back</a>
      </header>

      <p class="intro">Photos from my journey so far. More coming soon.</p>

      <section class="gallery" aria-label="Photo gallery">
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 1</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 2</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 3</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 4</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 5</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 6</figcaption></figure>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Vihaan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --navy: #16263f;
        --navy-soft: #24395c;
        --gold: #b08d57;
        --ink: #1d2430;
        --muted: #5c6577;
        --line: #d9dde5;
        --bg: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 1.05rem;
        line-height: 1.55;
        color: var(--ink);
        background: var(--bg);
      }

      h1 {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-weight: 600;
      }

      .masthead {
        color: #fff;
        background: var(--navy);
        border-bottom: 4px solid var(--gold);
      }

      .masthead-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 24px;
      }

      .masthead h1 {
        margin: 0;
        font-size: 2.2rem;
        line-height: 1.1;
      }

      .back {
        padding: 9px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 4px;
      }

      .back:hover,
      .back:focus-visible {
        background: rgba(255, 255, 255, 0.12);
      }

      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 24px 24px;
      }

      .intro {
        margin: 0 0 28px;
        color: var(--muted);
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
      }

      /* To add a photo, replace a .slot div with:
         <img src="your-photo.jpg" alt="Describe the photo"> */
      .frame {
        margin: 0;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 1px 3px rgba(22, 38, 63, 0.08);
      }

      .frame img,
      .slot {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .slot {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        background: #e9ecf1;
      }

      figcaption {
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--navy);
        border-top: 1px solid var(--line);
      }

      footer {
        max-width: 960px;
        margin: 0 auto;
        padding: 8px 24px 40px;
        font-size: 0.9rem;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .masthead h1 {
          font-size: 1.8rem;
        }

        .page {
          padding: 28px 16px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <h1>Photo Gallery</h1>
        <a class="back" href="index.html">&larr; Back to Home</a>
      </div>
    </header>

    <main class="page">
      <p class="intro">A selection of photographs from my life. More will be added soon.</p>

      <section class="gallery" aria-label="Photo gallery">
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 1</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 2</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 3</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 4</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 5</figcaption></figure>
        <figure class="frame"><div class="slot">Photo coming soon</div><figcaption>Photo 6</figcaption></figure>
      </section>
    </main>

    <footer>&copy; 2026 Vihaan</footer>
  </body>
</html>
